<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Bonsai</title>
<meta name="theme-color" content="#121512">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bonsai">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{--bg:#121512;--card:#1b201b;--tx:#e8ede8;--mut:#9aa59b;--ac:#6fbf84;--ac2:#243026;--bd:#2c342d;--danger:#f2877f;--warn:#e9b44c}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg);border-bottom:1px solid var(--bd)}
header h1{flex:1;margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:var(--ac2);color:var(--ac);font-size:22px;line-height:1}
main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:12px 4px;color:var(--mut);font-size:14px}
nav.tabs button.on{color:var(--ac);font-weight:600}
nav.tabs .n{background:var(--warn);color:#000;border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.tree{text-align:left;padding:0;width:100%}
.tree .cap{aspect-ratio:1/1;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.tree .cap img{width:100%;height:100%;object-fit:cover;display:block}
.tree .tx{padding:8px 10px 10px}
.tree b{display:block;font-size:15px}
.tree small{color:var(--mut);display:block;font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px;color:var(--mut)}
.chip.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13.5px}
.btn{border:0;border-radius:12px;padding:13px 16px;background:var(--ac);color:#0b140d;font-weight:600;width:100%;margin-top:14px}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn.dng{background:transparent;color:var(--danger);border:1px solid var(--bd)}
.row{display:flex;gap:10px}.row>*{flex:1}
.reg{display:flex;gap:10px;padding:10px;margin-bottom:8px;text-align:left;width:100%}
.reg .th{flex:none;width:64px;height:64px;border-radius:10px;background:var(--ac2);overflow:hidden;display:flex;align-items:center;justify-content:center}
.reg .th img{width:100%;height:100%;object-fit:cover}
.reg .in{flex:1;min-width:0}
.reg b{display:block}.reg small{color:var(--mut)}.reg p{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;background:var(--ac2);color:var(--ac);margin-left:6px}
.tag.pl{background:#3a3220;color:var(--warn)}
.late{color:var(--danger)}
h2{font-size:15px;color:var(--mut);margin:18px 2px 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px}
.viewer{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
.info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px;font-size:14.5px}
.info span:nth-child(odd){color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.toast{max-width:90vw;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);color:var(--tx);padding:10px 16px;border-radius:12px;z-index:40}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px}
.task .in{flex:1;min-width:0}.task button{flex:none;border:0;background:var(--ac2);color:var(--ac);border-radius:10px;padding:10px 12px}
.aviso{background:#3a3220;color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.aviso button{border:0;background:none;color:var(--warn);text-decoration:underline;padding:0}
.bem{text-align:center;padding:28px 12px}.bem h2{text-transform:none;font-size:22px;color:var(--tx);letter-spacing:0}
.bem p{color:var(--mut)}
.small{color:var(--mut);font-size:13.5px;margin:6px 2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== Meus Bonsai (versão sem conta): tudo fica neste aparelho, no navegador (IndexedDB) =====
const TIPOS = ['Poda','Adubação','Transplante','Arame','Tratamento','Aquisição','Outro'];
const LOCAIS = ['Chão','Prateleira','Indoor','Sombra'];
const $app = document.getElementById('app');
const S = { arvores:[], regs:[], aba:'arvores', filtro:'', busca:'', det:null, urls:new Map(), mostraTodas:false };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmt = d => d ? d.split('-').reverse().join('/') : '';
const diasAte = d => Math.round((new Date(d+'T00:00:00') - new Date(hoje()+'T00:00:00')) / 864e5);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2));
function toast(t){ const e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),3000); }

// ---------- banco local (IndexedDB) ----------
let _db;
function abreDB(){
  return _db || (_db = new Promise((ok, falha) => {
    const rq = indexedDB.open('meus-bonsai', 1);
    rq.onupgradeneeded = () => {
      const d = rq.result;
      d.createObjectStore('arvores', { keyPath:'id' });
      d.createObjectStore('registros', { keyPath:'id' });
      d.createObjectStore('meta', { keyPath:'k' });
    };
    rq.onsuccess = () => ok(rq.result);
    rq.onerror = () => falha(rq.error);
  }));
}
async function tx(store, modo, fn){
  const d = await abreDB();
  return new Promise((ok, falha) => {
    const t = d.transaction(store, modo); const r = fn(t.objectStore(store));
    t.oncomplete = () => ok(r && 'result' in r ? r.result : undefined);
    t.onerror = () => falha(t.error); t.onabort = () => falha(t.error);
  });
}
const dbAll = st => tx(st, 'readonly', s => s.getAll());
const dbPut = (st, o) => tx(st, 'readwrite', s => s.put(o));
const dbDel = (st, id) => tx(st, 'readwrite', s => s.delete(id));
const getMeta = k => tx('meta', 'readonly', s => s.get(k)).then(x => x && x.v);
const setMeta = (k, v) => dbPut('meta', { k, v });

async function carregar(){
  S.arvores = (await dbAll('arvores')).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
  S.regs = await dbAll('registros');
}
const regsDe = id => S.regs.filter(r => r.arvore_id === id)
  .sort((a,b) => b.data.localeCompare(a.data) || (b.criado||'').localeCompare(a.criado||''));
function capaDe(id){ const r = regsDe(id).find(r => r.status === 'feito' && r.thumb); return r || null; }

// ---------- fotos ----------
function urlDe(r, campo='thumb'){
  const b = r && r[campo]; if (!b) return '';
  const k = r.id + ':' + campo + ':' + (r.fotoVer || 0);
  if (!S.urls.has(k)) S.urls.set(k, URL.createObjectURL(b));
  return S.urls.get(k);
}
function img(r, campo, alt=''){ const u = urlDe(r, campo); return u ? `<img loading="lazy" src="${esc(u)}" alt="${esc(alt)}">` : ''; }
function limpaUrls(r){ for (const [k,u] of S.urls) if (k.startsWith(r.id+':')) { URL.revokeObjectURL(u); S.urls.delete(k); } }

function redimensiona(file, max, qual){
  return new Promise((ok, falha) => {
    const im = new Image(), u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? ok(b) : falha(new Error('Falha ao processar a foto')), 'image/jpeg', qual);
    };
    im.onerror = () => { URL.revokeObjectURL(u); falha(new Error('Não consegui abrir a foto')); };
    im.src = u;
  });
}

// ---------- tarefas ----------
function tarefasVisiveis(){
  const nomes = new Map(S.arvores.map(a => [a.id, a.nome]));
  const pl = S.regs.filter(r => r.status === 'planejado' && nomes.has(r.arvore_id)).sort((a,b) => a.data.localeCompare(b.data));
  const vistos = new Set(), out = [];
  for (const t of pl) { if (vistos.has(t.arvore_id) || diasAte(t.data) > 30) continue; vistos.add(t.arvore_id); out.push({ ...t, nome: nomes.get(t.arvore_id) }); }
  return out;
}

// ---------- telas ----------
function moldura(titulo, corpo, { voltar=false, acao='' } = {}){
  const nt = tarefasVisiveis().filter(t => diasAte(t.data) <= 0).length;
  $app.innerHTML = `<header>${voltar?'<button class="ib" id="vb" aria-label="Voltar">‹</button>':''}<h1>${esc(titulo)}</h1>${acao}</header>
  <main>${corpo}</main>
  <nav class="tabs"><button data-a="arvores" class="${S.aba==='arvores'?'on':''}">🌳 Árvores</button>
  <button data-a="tarefas" class="${S.aba==='tarefas'?'on':''}">✅ Tarefas${nt?`<span class="n">${nt}</span>`:''}</button>
  <button data-a="backup" class="${S.aba==='backup'?'on':''}">💾 Backup</button></nav>`;
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { S.aba = b.dataset.a; S.det = null; desenha(); });
  const vb = document.getElementById('vb'); if (vb) vb.onclick = () => { S.det = null; desenha(); };
}
function desenha(){ S.det ? telaDetalhe() : S.aba === 'tarefas' ? telaTarefas() : S.aba === 'backup' ? telaBackup() : telaLista(); }

async function avisoBackup(){
  if (!S.arvores.length) return '';
  const ult = await getMeta('ultimoBackup');
  const dias = ult ? Math.floor((Date.now() - ult) / 864e5) : null;
  if (dias !== null && dias < 30) return '';
  return `<div class="aviso">${ult ? `Seu último backup foi há ${dias} dias.` : 'Você ainda não fez backup.'} Os dados ficam só neste celular. <button id="gb">Fazer backup agora</button></div>`;
}

async function telaLista(){
  const q = S.busca.toLowerCase();
  const lista = S.arvores.filter(a => (!S.filtro || a.local === S.filtro) && (!q || (a.nome+' '+a.especie).toLowerCase().includes(q)));
  const av = await avisoBackup();
  if (S.det || S.aba !== 'arvores') return;
  if (!S.arvores.length) {
    moldura('Meus Bonsai', `<div class="bem"><h2>🌳 Bem-vindo!</h2><p>Aqui você cadastra suas árvores e registra podas, adubações e fotos. Tudo fica guardado neste celular.</p>
      <button class="btn" id="nv0">Cadastrar a primeira árvore</button>
      <p class="small">Já tem um backup? Vá na aba 💾 Backup para restaurar.</p></div>`);
    document.getElementById('nv0').onclick = () => formArvore(null);
    return;
  }
  const chips = ['', ...LOCAIS].map(l => `<button class="chip ${S.filtro===l?'on':''}" data-l="${l}">${l||'Todas'}</button>`).join('');
  moldura('Meus Bonsai', `${av}<input id="bq" type="search" placeholder="Buscar…" value="${esc(S.busca)}" style="margin-bottom:10px">
    <div class="chips">${chips}</div>
    ${lista.length ? `<div class="grid">${lista.map(a => { const c = capaDe(a.id); const n = S.regs.filter(r => r.arvore_id === a.id && r.status === 'feito').length;
      return `<button class="card tree" data-id="${a.id}"><div class="cap">${c ? img(c, 'thumb', a.nome) : '🌳'}</div>
      <div class="tx"><b>${esc(a.nome)}</b><small>${esc(a.especie)}${a.local?' · '+esc(a.local):''}</small><small>${n} registro(s)</small></div></button>`; }).join('')}</div>`
      : '<div class="empty">Nenhuma árvore encontrada.</div>'}`,
    { acao: '<button class="ib" id="nv" aria-label="Nova árvore">＋</button>' });
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { S.filtro = c.dataset.l; telaLista(); });
  document.querySelectorAll('.tree').forEach(c => c.onclick = () => { S.det = S.arvores.find(a => a.id === c.dataset.id); telaDetalhe(); });
  const bq = document.getElementById('bq');
  bq.oninput = () => { S.busca = bq.value; const p = bq.selectionStart; telaLista().then(() => { const n = document.getElementById('bq'); if (n) { n.focus(); n.setSelectionRange(p,p); } }); };
  document.getElementById('nv').onclick = () => formArvore(null);
  const gb = document.getElementById('gb'); if (gb) gb.onclick = () => { S.aba = 'backup'; desenha(); };
}

function telaTarefas(){
  const vis = tarefasVisiveis(), lim = S.mostraTodas ? vis.length : 5;
  const item = t => { const d = diasAte(t.data);
    return `<div class="card task"><div class="in"><b>${esc(t.nome)}</b> <span class="tag pl">${esc(t.tipo)}</span>
      <small style="display:block;color:${d<0?'var(--danger)':'var(--mut)'}">${d<0?'Atrasada '+(-d)+' d · ':d===0?'Hoje · ':''}${fmt(t.data)}${t.obs?' — '+esc(t.obs):''}</small></div>
      <button data-id="${t.id}">Concluir</button></div>`; };
  moldura('Tarefas', vis.length
    ? vis.slice(0, lim).map(item).join('') + (vis.length > lim ? `<button class="btn sec" id="mais">Mais ${vis.length-lim} tarefa(s)</button>` : '')
    : '<div class="empty">Nada planejado para os próximos 30 dias. 🌱<p class="small">Para planejar um cuidado, abra uma árvore → ＋ Registro → Situação: Planejado.</p></div>');
  document.querySelectorAll('.task button').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const r = S.regs.find(x => x.id === b.dataset.id); r.status = 'feito'; r.data = hoje();
    await dbPut('registros', r); toast('Tarefa concluída'); telaTarefas();
  });
  const m = document.getElementById('mais'); if (m) m.onclick = () => { S.mostraTodas = true; telaTarefas(); };
}

function telaDetalhe(){
  const a = S.det, regs = regsDe(a.id);
  const linhas = [['Espécie',a.especie],['Origem',a.origem],['Aquisição',fmt(a.aquisicao)],['Estilo',a.estilo],['Vaso',a.vaso],['Local',a.local],['Notas',a.notas]]
    .filter(x => x[1]).map(x => `<span>${x[0]}</span><span>${esc(x[1])}</span>`).join('');
  const plan = regs.filter(r => r.status === 'planejado').sort((x,y) => x.data.localeCompare(y.data));
  const feit = regs.filter(r => r.status !== 'planejado');
  const reg = r => `<button class="card reg" data-id="${r.id}"><div class="th">${img(r,'thumb') || (r.foto ? '📷' : '')}</div>
    <div class="in"><b>${esc(r.tipo)}<span class="tag ${r.status==='planejado'?'pl':''}">${r.status==='planejado'?'planejado':'feito'}</span></b>
    <small>${fmt(r.data)}</small>${r.obs?`<p>${esc(r.obs)}</p>`:''}</div></button>`;
  moldura(a.nome, `<div class="card info">${linhas || '<span>—</span><span>Sem detalhes</span>'}</div>
    <div class="row"><button class="btn" id="nr">＋ Registro</button><button class="btn sec" id="ea">Editar árvore</button></div>
    ${plan.length ? '<h2>Planejado</h2>' + plan.map(reg).join('') : ''}
    <h2>Histórico (${feit.length})</h2>${feit.length ? feit.map(reg).join('') : '<div class="empty">Sem registros ainda.</div>'}`, { voltar:true });
  document.getElementById('nr').onclick = () => formRegistro(null);
  document.getElementById('ea').onclick = () => formArvore(a);
  document.querySelectorAll('.reg').forEach(b => b.onclick = () => formRegistro(S.regs.find(r => r.id === b.dataset.id)));
}

// ---------- formulários ----------
function folha(html){
  const el = document.createElement('div'); el.className = 'sheet'; el.innerHTML = `<div>${html}</div>`;
  el.addEventListener('click', e => { if (e.target === el) el.remove(); });
  document.body.appendChild(el); return el;
}

function formArvore(a){
  const el = folha(`<h3>${a?'Editar árvore':'Nova árvore'}</h3><form id="fa">
  <label>Nome</label><input name="nome" required value="${esc(a?.nome)}">
  <label>Espécie</label><input name="especie" value="${esc(a?.especie)}">
  <div class="row"><div><label>Origem</label><input name="origem" value="${esc(a?.origem)}"></div>
  <div><label>Aquisição</label><input type="date" name="aquisicao" value="${esc(a?.aquisicao)}"></div></div>
  <div class="row"><div><label>Estilo</label><input name="estilo" value="${esc(a?.estilo)}"></div>
  <div><label>Vaso</label><input name="vaso" value="${esc(a?.vaso)}"></div></div>
  <label>Local</label><select name="local"><option value="">—</option>${LOCAIS.map(l=>`<option ${a?.local===l?'selected':''}>${l}</option>`).join('')}</select>
  <label>Notas</label><textarea name="notas">${esc(a?.notas)}</textarea>
  <button class="btn" type="submit">Salvar</button>
  ${a?'<button class="btn dng" type="button" id="del">Excluir árvore</button>':''}
  <button class="btn sec" type="button" id="cn">Cancelar</button></form>`);
  el.querySelector('#cn').onclick = () => el.remove();
  el.querySelector('#fa').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const row = { ...(a || {}), id: a?.id || uid(), nome:f.get('nome').trim(), especie:f.get('especie').trim(), origem:f.get('origem').trim(),
      aquisicao:f.get('aquisicao') || null, estilo:f.get('estilo').trim(), vaso:f.get('vaso').trim(), local:f.get('local'), notas:f.get('notas').trim(),
      criado: a?.criado || new Date().toISOString() };
    await dbPut('arvores', row); el.remove(); await carregar();
    S.det = a ? S.arvores.find(x => x.id === row.id) : null; desenha(); toast('Salvo');
  };
  const d = el.querySelector('#del');
  if (d) d.onclick = async () => {
    if (!confirm('Excluir "'+a.nome+'" e todos os registros e fotos dela? Não dá para desfazer.')) return;
    for (const r of S.regs.filter(r => r.arvore_id === a.id)) { limpaUrls(r); await dbDel('registros', r.id); }
    await dbDel('arvores', a.id); el.remove(); S.det = null; await carregar(); desenha(); toast('Árvore excluída');
  };
}

function formRegistro(r){
  const a = S.det;
  const tipos = [...new Set([...TIPOS, ...S.regs.map(x => x.tipo)])];
  const el = folha(`<h3>${r?'Registro':'Novo registro'} — ${esc(a.nome)}</h3><form id="fr">
  <div class="row"><div><label>Data</label><input type="date" name="data" required value="${esc(r?.data || hoje())}"></div>
  <div><label>Tipo</label><select name="tipo">${tipos.map(t=>`<option ${r?.tipo===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div>
  <label>Situação</label><select name="status"><option value="feito" ${r?.status!=='planejado'?'selected':''}>Feito</option><option value="planejado" ${r?.status==='planejado'?'selected':''}>Planejado</option></select>
  <label>Observações</label><textarea name="obs">${esc(r?.obs)}</textarea>
  ${r?.foto ? `<label>Foto atual</label><button type="button" class="card reg" id="vf"><div class="th">${img(r,'thumb')}</div><div class="in"><small>Toque para ampliar</small></div></button>` : ''}
  <label>${r?.foto ? 'Trocar foto' : 'Foto'}</label><input type="file" name="foto" accept="image/*">
  <button class="btn" type="submit" id="sv">Salvar</button>
  ${r?'<button class="btn dng" type="button" id="del">Excluir registro</button>':''}
  <button class="btn sec" type="button" id="cn">Cancelar</button><div class="small" id="er"></div></form>`);
  el.querySelector('#cn').onclick = () => el.remove();
  const vf = el.querySelector('#vf'); if (vf) vf.onclick = () => ampliar(urlDe(r, 'foto'));
  el.querySelector('#fr').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), er = el.querySelector('#er'), sv = el.querySelector('#sv');
    sv.disabled = true; er.textContent = 'Salvando…';
    try {
      const row = { ...(r || {}), id: r?.id || uid(), arvore_id: a.id, data:f.get('data'), tipo:f.get('tipo'), obs:f.get('obs').trim(), status:f.get('status'), criado: r?.criado || new Date().toISOString() };
      const file = f.get('foto');
      if (file && file.size) {
        er.textContent = 'Processando a foto…';
        const [grande, mini] = await Promise.all([redimensiona(file, 1400, .8), redimensiona(file, 420, .75)]);
        if (r) limpaUrls(r);
        row.foto = grande; row.thumb = mini; row.fotoVer = (r?.fotoVer || 0) + 1;
      }
      await dbPut('registros', row); el.remove(); await carregar();
      S.det = S.arvores.find(x => x.id === a.id); desenha(); toast('Salvo');
    } catch (x) { er.textContent = 'Erro: ' + (x.message || x); sv.disabled = false; }
  };
  const d = el.querySelector('#del');
  if (d) d.onclick = async () => {
    if (!confirm('Excluir este registro?')) return;
    limpaUrls(r); await dbDel('registros', r.id); el.remove(); await carregar();
    S.det = S.arvores.find(x => x.id === a.id); desenha(); toast('Registro excluído');
  };
}

function ampliar(u){
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<img src="${esc(u)}" alt=""><button class="ib">✕</button>`;
  v.onclick = () => v.remove(); document.body.appendChild(v);
}

// ---------- backup ----------
const blobParaDataUrl = b => new Promise((ok, falha) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = () => falha(f.error); f.readAsDataURL(b); });
const dataUrlParaBlob = async u => (await fetch(u)).blob();

async function montaBackup(){
  const regs = [];
  for (const r of S.regs) {
    const o = { ...r };
    if (r.foto) o.foto = await blobParaDataUrl(r.foto);
    if (r.thumb) o.thumb = await blobParaDataUrl(r.thumb);
    regs.push(o);
  }
  return JSON.stringify({ app: 'meus-bonsai', versao: 1, exportado: new Date().toISOString(), arvores: S.arvores, registros: regs });
}

async function fazBackup(){
  const nome = 'bonsai-backup-' + hoje() + '.json';
  const txt = await montaBackup();
  // 1) menu "Compartilhar" do Android (escolha Drive); 2) como texto; 3) download
  for (const tipo of ['application/json', 'text/plain']) {
    const file = new File([txt], nome, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Backup Meus Bonsai' }); await setMeta('ultimoBackup', Date.now()); toast('Backup enviado'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type:'application/json' })); a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  await setMeta('ultimoBackup', Date.now()); toast('Backup baixado na pasta Downloads');
}

async function restaura(file){
  const dados = JSON.parse(await file.text());
  if (dados.app !== 'meus-bonsai' || !Array.isArray(dados.arvores) || !Array.isArray(dados.registros)) throw new Error('Esse arquivo não é um backup do Meus Bonsai.');
  if (!confirm(`Restaurar ${dados.arvores.length} árvore(s) e ${dados.registros.length} registro(s)? O que já existe com o mesmo código será substituído; o resto é mantido.`)) return;
  for (const a of dados.arvores) await dbPut('arvores', a);
  for (const r of dados.registros) {
    const o = { ...r };
    if (typeof o.foto === 'string') o.foto = await dataUrlParaBlob(o.foto);
    if (typeof o.thumb === 'string') o.thumb = await dataUrlParaBlob(o.thumb);
    o.fotoVer = (o.fotoVer || 0) + 1;
    await dbPut('registros', o);
  }
  S.urls.forEach(u => URL.revokeObjectURL(u)); S.urls.clear();
  await carregar(); toast('Backup restaurado');
}

async function telaBackup(){
  const ult = await getMeta('ultimoBackup');
  moldura('Backup', `<div class="card" style="padding:14px"><b>Seus dados ficam só neste celular.</b>
    <p class="small">Se você limpar os dados do navegador, desinstalar o app ou trocar de aparelho, só recupera com um backup. Faça de vez em quando e guarde no Google Drive.</p>
    <p class="small">${ult ? 'Último backup: ' + new Date(ult).toLocaleString('pt-BR') : 'Você ainda não fez backup.'}</p>
    <button class="btn" id="bk">Salvar backup (escolha Drive)</button>
    <p class="small">Vai abrir o menu de compartilhar do Android: escolha <b>Drive</b> e depois <b>Salvar</b>.</p></div>
  <div class="card" style="padding:14px;margin-top:12px"><b>Restaurar de um backup</b>
    <p class="small">Escolha o arquivo <i>bonsai-backup-….json</i> que você salvou no Drive.</p>
    <input type="file" id="rs" accept=".json,application/json,text/plain"></div>`);
  document.getElementById('bk').onclick = async () => { try { await fazBackup(); telaBackup(); } catch (e) { toast('Erro: ' + (e.message || e)); } };
  document.getElementById('rs').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { await restaura(f); S.aba = 'arvores'; desenha(); } catch (x) { toast('Erro: ' + (x.message || x)); } };
}

// ---------- início ----------
(async () => {
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();   // pede ao navegador para não apagar os dados
    await carregar(); desenha();
  } catch (e) { $app.innerHTML = `<div class="bem"><h2>Ops</h2><p>Não consegui abrir o banco de dados do navegador.</p><p class="small">${esc(e.message||e)}</p><p class="small">Se estiver em aba anônima, abra numa aba normal.</p></div>`; }
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
